name: Docs Visual Capture

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packaged console
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Boot real consumer console
        env:
          INSTABOTAI_STATE_DB_PATH: /tmp/instabotai-docs.sqlite3
          INSTABOTAI_INSTAGRAM_ACCESS_TOKEN: docs-capture-token
          INSTABOTAI_INSTAGRAM_ACCOUNT_ID: docs-capture-account
          INSTABOTAI_UI_OPEN_BROWSER: "false"
        run: |
          instabotai ui --no-browser >/tmp/instabotai-docs-ui.log 2>&1 &
          echo $! >/tmp/instabotai-docs-ui.pid
          python - <<'PY'
          import json
          import time
          import urllib.request

          for attempt in range(30):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8765/healthz", timeout=2) as response:
                      if json.load(response).get("status") == "ok":
                          break
              except Exception:
                  if attempt == 29:
                      raise
                  time.sleep(1)
          PY

      - name: Capture Overview from the running product
        run: |
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$browser"
          mkdir -p docs/screenshots
          "$browser" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --window-size=1440,1180 \
            --virtual-time-budget=5000 \
            --screenshot=docs/screenshots/consumer-console-overview.png \
            http://127.0.0.1:8765/
          test -s docs/screenshots/consumer-console-overview.png

      - name: Record capture provenance
        env:
          CAPTURE_BRANCH: ${{ github.ref_name }}
          CAPTURE_SHA: ${{ github.sha }}
          CAPTURE_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          branch = os.environ["CAPTURE_BRANCH"]
          sha = os.environ["CAPTURE_SHA"]
          run_id = os.environ["CAPTURE_RUN_ID"]

          provenance = f"""# Capture Provenance

          ## Consumer console overview

          - Asset: `consumer-console-overview.png`
          - Source branch at capture: `{branch}`
          - Source commit captured: `{sha}`
          - Workflow run: Docs Visual Capture (`{run_id}`)
          - Method: install package, launch the real local FastAPI console, wait for `/healthz`, capture `http://127.0.0.1:8765/` with headless Chrome.
          - Configuration: secret-free CI-only provider placeholders; no authenticated Instagram or AI success is claimed by this image.

          This file is rewritten by the Docs Visual Capture workflow whenever the screenshot is intentionally recaptured.
          """
          Path("docs/screenshots/CAPTURE_PROVENANCE.md").write_text(
              "\n".join(line.strip() for line in provenance.splitlines()).strip() + "\n",
              encoding="utf-8",
          )

          inventory_path = Path("docs/PRODUCT_SURFACES.md")
          inventory = inventory_path.read_text(encoding="utf-8")
          row_prefix = "| `screenshots/consumer-console-overview.png` |"
          replacement = (
              "| `screenshots/consumer-console-overview.png` | Real product screenshot | "
              "Current packaged Overview/readiness surface | "
              f"Docs Visual Capture run `{run_id}`; source head `{sha}`; "
              "canonical details in `screenshots/CAPTURE_PROVENANCE.md` |"
          )
          lines = inventory.splitlines()
          matches = [index for index, line in enumerate(lines) if line.startswith(row_prefix)]
          if len(matches) != 1:
              raise SystemExit(
                  f"expected one consumer-console inventory row, found {len(matches)}"
              )
          lines[matches[0]] = replacement
          inventory_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Commit current product capture and provenance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/screenshots/consumer-console-overview.png \
            docs/screenshots/CAPTURE_PROVENANCE.md \
            docs/PRODUCT_SURFACES.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: refresh real console screenshot [docs-capture]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
