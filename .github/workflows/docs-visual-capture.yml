name: Docs Visual Capture

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Verify exact capture source
        shell: bash
        run: |
          set -euo pipefail
          checked_out_sha=$(git rev-parse HEAD)
          test "$checked_out_sha" = "$GITHUB_SHA"
          printf '%s\n' "$checked_out_sha" > /tmp/instabotai-docs-source-sha

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packaged console
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Boot real consumer console
        env:
          INSTABOTAI_STATE_DB_PATH: /tmp/instabotai-docs.sqlite3
          INSTABOTAI_INSTAGRAM_ACCESS_TOKEN: docs-capture-token
          INSTABOTAI_INSTAGRAM_ACCOUNT_ID: docs-capture-account
          INSTABOTAI_UI_OPEN_BROWSER: "false"
        run: |
          instabotai ui --no-browser >/tmp/instabotai-docs-ui.log 2>&1 &
          echo $! >/tmp/instabotai-docs-ui.pid
          python - <<'PY'
          import json
          import time
          import urllib.request

          for attempt in range(30):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8765/healthz", timeout=2) as response:
                      if json.load(response).get("status") == "ok":
                          break
              except Exception:
                  if attempt == 29:
                      raise
                  time.sleep(1)
          PY

      - name: Capture Overview from the running product
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$browser"
          mkdir -p docs-capture
          "$browser" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --window-size=1440,1180 \
            --virtual-time-budget=5000 \
            --screenshot=docs-capture/consumer-console-overview.png \
            http://127.0.0.1:8765/
          test -s docs-capture/consumer-console-overview.png

      - name: Record capture provenance
        shell: bash
        run: |
          set -euo pipefail
          checked_out_sha=$(cat /tmp/instabotai-docs-source-sha)
          {
            echo "# Consumer console capture provenance"
            echo
            echo "- Source commit: \`${checked_out_sha}\`"
            echo "- Source ref: \`${GITHUB_REF}\`"
            echo "- Workflow run: \`${GITHUB_RUN_ID}\`"
            echo "- Workflow attempt: \`${GITHUB_RUN_ATTEMPT}\`"
            echo "- Captured at: \`$(date -u +'%Y-%m-%dT%H:%M:%SZ')\`"
            echo "- Runtime: packaged InstabotAI consumer console"
            echo "- Health proof: \`GET /healthz -> status=ok\`"
            echo
            echo "This artifact is a capture candidate. Committing it to the repository requires"
            echo "updating docs/screenshots/CAPTURE_PROVENANCE.md and docs/PRODUCT_SURFACES.md"
            echo "in the same reviewed change."
          } > docs-capture/CAPTURE_PROVENANCE.md

      - name: Upload capture candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: instabotai-docs-visual-${{ github.sha }}
          path: docs-capture/
          if-no-files-found: error
          retention-days: 14
