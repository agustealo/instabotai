name: Quality Gate

on:
  push:
    branches:
      - master
      - "revival/**"
      - "consumer-trial/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and quality dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check instabotai tests

      - name: Mypy
        run: python -m mypy instabotai

      - name: Schema migration authority
        run: |
          python - <<'PY'
          from pathlib import Path

          offenders = []
          for path in sorted(Path("instabotai").rglob("*.py")):
              if path == Path("instabotai/storage.py"):
                  continue
              for number, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  if "ALTER TABLE" in line.upper():
                      offenders.append(f"{path}:{number}: {line.strip()}")
          if offenders:
              raise SystemExit(
                  "Schema migrations must be owned by instabotai/storage.py only:\n"
                  + "\n".join(offenders)
              )
          print("Verified canonical schema migration ownership.")
          PY

      - name: Pytest
        run: python -m pytest

      - name: Documentation visual references
        run: |
          python - <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path
          from urllib.parse import unquote

          root = Path.cwd().resolve()
          markdown_files = [root / "README.md", *sorted((root / "docs").glob("*.md"))]
          markdown_image = re.compile(r"!\[[^\]]*\]\(([^)]+)\)")
          html_image = re.compile(r"<img\b[^>]*\bsrc=[\"']([^\"']+)[\"']", re.IGNORECASE)
          failures: list[str] = []
          checked = 0

          for markdown in markdown_files:
              text = markdown.read_text(encoding="utf-8")
              refs = markdown_image.findall(text) + html_image.findall(text)
              for raw_ref in refs:
                  ref = raw_ref.strip().split()[0].strip("<>")
                  if ref.startswith(("http://", "https://", "data:", "#")):
                      continue
                  ref = unquote(ref.split("#", 1)[0].split("?", 1)[0])
                  if not ref:
                      continue
                  asset = (markdown.parent / ref).resolve()
                  try:
                      asset.relative_to(root)
                  except ValueError:
                      failures.append(f"{markdown.relative_to(root)}: image escapes repository: {raw_ref}")
                      continue
                  checked += 1
                  if not asset.is_file():
                      failures.append(f"{markdown.relative_to(root)}: missing image: {raw_ref}")
                  elif asset.stat().st_size == 0:
                      failures.append(f"{markdown.relative_to(root)}: empty image: {raw_ref}")

          if failures:
              raise SystemExit("\n".join(failures))
          print(f"Verified {checked} local documentation image references.")
          PY

      - name: Package smoke
        run: |
          instabotai doctor
          python -c "from instabotai.web import create_app; assert create_app().title == 'InstabotAI Consumer Console'"

      - name: Wheel install and legacy-state upgrade smoke
        run: |
          rm -rf dist /tmp/instabotai-wheel-smoke
          python -m pip wheel . --no-deps --wheel-dir dist
          python -m venv /tmp/instabotai-wheel-smoke
          /tmp/instabotai-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/instabotai-wheel-smoke/bin/python -m pip install dist/instabotai-*.whl

          python - <<'PY'
          import sqlite3
          from pathlib import Path

          database = Path("/tmp/instabotai-wheel-smoke/legacy-state.sqlite3")
          connection = sqlite3.connect(database)
          try:
              connection.execute(
                  """
                  CREATE TABLE automation_actions (
                      idempotency_key TEXT PRIMARY KEY,
                      action_type TEXT NOT NULL,
                      target_id TEXT,
                      status TEXT NOT NULL,
                      reason TEXT NOT NULL,
                      confidence REAL NOT NULL,
                      payload_json TEXT NOT NULL,
                      created_at TEXT NOT NULL,
                      executed_at TEXT,
                      provider_result TEXT,
                      error TEXT
                  )
                  """
              )
              connection.execute(
                  """
                  INSERT INTO automation_actions (
                      idempotency_key, action_type, target_id, status, reason,
                      confidence, payload_json, created_at
                  ) VALUES (
                      'wheel-legacy-action', 'reply_to_comment', 'comment-1', 'succeeded',
                      'legacy wheel upgrade proof', 0.91, '{}', '2026-09-21T12:00:00+00:00'
                  )
                  """
              )
              connection.commit()
          finally:
              connection.close()
          PY

          set +e
          INSTABOTAI_STATE_DB_PATH=/tmp/instabotai-wheel-smoke/legacy-state.sqlite3 \
            /tmp/instabotai-wheel-smoke/bin/instabotai state-check >/tmp/wheel-state-before.json
          before_status=$?
          set -e
          test "$before_status" -eq 2

          INSTABOTAI_STATE_DB_PATH=/tmp/instabotai-wheel-smoke/legacy-state.sqlite3 \
            /tmp/instabotai-wheel-smoke/bin/instabotai state-upgrade
          INSTABOTAI_STATE_DB_PATH=/tmp/instabotai-wheel-smoke/legacy-state.sqlite3 \
            /tmp/instabotai-wheel-smoke/bin/instabotai state-check

          /tmp/instabotai-wheel-smoke/bin/python - <<'PY'
          import sqlite3
          from pathlib import Path

          database = "/tmp/instabotai-wheel-smoke/legacy-state.sqlite3"
          with sqlite3.connect(database) as connection:
              row = connection.execute(
                  "SELECT idempotency_key, retryable FROM automation_actions "
                  "WHERE idempotency_key = 'wheel-legacy-action'"
              ).fetchone()
          assert row == ("wheel-legacy-action", 1)
          backups = list(Path("/tmp/instabotai-wheel-smoke/backups").glob("*.sqlite3"))
          assert len(backups) == 1, backups
          PY

          INSTABOTAI_STATE_DB_PATH=/tmp/instabotai-wheel-smoke/legacy-state.sqlite3 \
          INSTABOTAI_INSTAGRAM_ACCESS_TOKEN=ci-readiness-token \
          INSTABOTAI_INSTAGRAM_ACCOUNT_ID=ci-account \
            /tmp/instabotai-wheel-smoke/bin/instabotai trial-readiness

      - name: Container legacy-state upgrade and runtime smoke
        run: |
          docker build -t instabotai-ci .
          docker run --rm instabotai-ci doctor

          rm -rf /tmp/instabotai-container-state
          mkdir -p /tmp/instabotai-container-state
          legacy_backup=$(find /tmp/instabotai-wheel-smoke/backups -name '*.sqlite3' -print -quit)
          test -n "$legacy_backup"
          cp "$legacy_backup" /tmp/instabotai-container-state/state.sqlite3

          container_uid=$(docker run --rm instabotai-ci id -u)
          container_gid=$(docker run --rm instabotai-ci id -g)
          sudo chown -R "$container_uid:$container_gid" /tmp/instabotai-container-state

          set +e
          docker run --rm \
            -v /tmp/instabotai-container-state:/data \
            -e INSTABOTAI_STATE_DB_PATH=/data/state.sqlite3 \
            instabotai-ci state-check >/tmp/container-state-before.json
          before_status=$?
          set -e
          test "$before_status" -eq 2

          docker run --rm \
            -v /tmp/instabotai-container-state:/data \
            -e INSTABOTAI_STATE_DB_PATH=/data/state.sqlite3 \
            instabotai-ci state-upgrade
          test -n "$(find /tmp/instabotai-container-state/backups -name '*.sqlite3' -print -quit)"

          docker run --rm \
            -v /tmp/instabotai-container-state:/data \
            -e INSTABOTAI_STATE_DB_PATH=/data/state.sqlite3 \
            instabotai-ci state-check

          docker run --rm \
            -v /tmp/instabotai-container-state:/data \
            -e INSTABOTAI_STATE_DB_PATH=/data/state.sqlite3 \
            -e INSTABOTAI_INSTAGRAM_ACCESS_TOKEN=ci-readiness-token \
            -e INSTABOTAI_INSTAGRAM_ACCOUNT_ID=ci-account \
            instabotai-ci trial-readiness

          container_id=$(docker run -d \
            -p 127.0.0.1:8765:8765 \
            -e INSTABOTAI_UI_HOST=0.0.0.0 \
            -e INSTABOTAI_UI_ALLOW_REMOTE=true \
            instabotai-ci ui --no-browser)
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT

          python - <<'PY'
          import json
          import time
          import urllib.request

          for attempt in range(30):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8765/healthz", timeout=2) as response:
                      payload = json.load(response)
                  if payload.get("status") == "ok":
                      break
              except Exception:
                  if attempt == 29:
                      raise
                  time.sleep(1)
          else:
              raise RuntimeError("consumer console did not become healthy")
          PY
