name: Quality Gate

on:
  push:
    branches:
      - master
      - "revival/**"
      - "consumer-trial/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and quality dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check instabotai tests

      - name: Mypy
        run: python -m mypy instabotai

      - name: Pytest
        run: python -m pytest

      - name: Package smoke
        run: |
          instabotai doctor
          python -c "from instabotai.web import create_app; assert create_app().title == 'InstabotAI Consumer Console'"

      - name: Wheel install and readiness smoke
        run: |
          rm -rf dist /tmp/instabotai-wheel-smoke
          python -m pip wheel . --no-deps --wheel-dir dist
          python -m venv /tmp/instabotai-wheel-smoke
          /tmp/instabotai-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/instabotai-wheel-smoke/bin/python -m pip install dist/instabotai-*.whl
          INSTABOTAI_STATE_DB_PATH=/tmp/instabotai-wheel-smoke/state.sqlite3 \
          INSTABOTAI_INSTAGRAM_ACCESS_TOKEN=ci-readiness-token \
          INSTABOTAI_INSTAGRAM_ACCOUNT_ID=ci-account \
            /tmp/instabotai-wheel-smoke/bin/instabotai trial-readiness

      - name: Container smoke
        run: |
          docker build -t instabotai-ci .
          docker run --rm instabotai-ci doctor
          docker run --rm \
            -e INSTABOTAI_STATE_DB_PATH=/tmp/instabotai-state.sqlite3 \
            -e INSTABOTAI_INSTAGRAM_ACCESS_TOKEN=ci-readiness-token \
            -e INSTABOTAI_INSTAGRAM_ACCOUNT_ID=ci-account \
            instabotai-ci trial-readiness

          container_id=$(docker run -d \
            -p 127.0.0.1:8765:8765 \
            -e INSTABOTAI_UI_HOST=0.0.0.0 \
            -e INSTABOTAI_UI_ALLOW_REMOTE=true \
            instabotai-ci ui --no-browser)
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT

          python - <<'PY'
          import json
          import time
          import urllib.request

          for attempt in range(30):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8765/healthz", timeout=2) as response:
                      payload = json.load(response)
                  if payload.get("status") == "ok":
                      break
              except Exception:
                  if attempt == 29:
                      raise
                  time.sleep(1)
          else:
              raise RuntimeError("consumer console did not become healthy")
          PY
