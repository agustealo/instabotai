name: Quality Gate

on:
  push:
    branches:
      - master
      - "revival/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and quality dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: |
          python -m ruff check \
            instabotai/__init__.py \
            instabotai/settings.py \
            instabotai/domain.py \
            instabotai/policy.py \
            instabotai/state.py \
            instabotai/automation.py \
            instabotai/providers \
            instabotai/research \
            instabotai/cli.py \
            tests

      - name: Mypy
        run: python -m mypy instabotai

      - name: Pytest
        run: python -m pytest

      - name: Package smoke
        run: |
          instabotai doctor
