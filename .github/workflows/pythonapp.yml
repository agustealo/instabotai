name: Quality Gate

on:
  push:
    branches:
      - master
      - "revival/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and quality dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check instabotai tests

      - name: Mypy
        run: python -m mypy instabotai

      - name: Pytest
        run: python -m pytest

      - name: Package smoke
        run: instabotai doctor

      - name: Container smoke
        run: |
          docker build -t instabotai-ci .
          docker run --rm instabotai-ci doctor
