[build-system]
requires = ["setuptools>=78", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "instabotai"
version = "2.0.0a1"
description = "Adaptive Instagram intelligence and policy-governed automation"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "InstabotAI maintainers" }]
dependencies = [
  "httpx>=0.28.1,<0.29",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "rich>=14,<15",
  "typer>=0.17,<1",
]

[project.optional-dependencies]
research = [
  "crawl4ai>=0.9.3,<0.10",
]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "respx>=0.22,<0.23",
  "ruff>=0.12,<0.14",
]

[project.scripts]
instabotai = "instabotai.cli:app"

[tool.setuptools.packages.find]
include = ["instabotai*"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["instabot", "mtcnn"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["^instabot/", "^mtcnn/", "^instabotai/ai\.py$"]

[[tool.mypy.overrides]]
module = ["crawl4ai", "crawl4ai.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
